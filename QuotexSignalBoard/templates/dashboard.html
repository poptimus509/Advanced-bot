<script>
        function updateTime() {
            const now = new Date();
            const options = { timeZone: 'Asia/Dhaka', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('bdt-time').innerText = now.toLocaleTimeString('en-GB', options) + " BDT";
        }
        setInterval(updateTime, 1000);

        async function fetchDashboardData() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                
                // Connection status check based on bot readiness and deriv connection
                const connEl = document.getElementById('connection-status');
                if (data.status === "online" && data.deriv_connected) {
                    connEl.innerText = "Deriv Connected";
                    connEl.className = "status-dot online";
                } else {
                    connEl.innerText = "Disconnected";
                    connEl.className = "status-dot offline";
                }

                // Performance stats
                const p = data.performance;
                if (p) {
                    document.getElementById('stat-total').innerText = p.total || 0;
                    document.getElementById('stat-settled').innerText = p.settled || 0;
                    document.getElementById('stat-wins').innerText = p.wins || 0;
                    document.getElementById('stat-losses').innerText = p.losses || 0;
                    document.getElementById('stat-winrate').innerText = (p.win_rate || 0) + '%';
                }

                // History table
                const historyRes = await fetch('/api/history');
                const historyData = await historyRes.json();
                const historyBody = document.getElementById('history-table-body');
                if (historyData && historyData.length > 0) {
                    historyBody.innerHTML = historyData.map(row => `
                        <tr>
                            <td>${row.timestamp ? row.timestamp.substring(11, 19) : '--'}</td>
                            <td><strong>${row.pair}</strong></td>
                            <td><span class="badge ${row.direction.toLowerCase()}">${row.direction}</span></td>
                            <td>${row.score}/11</td>
                            <td>${row.quality}</td>
                            <td>${row.bias}</td>
                            <td>${row.price ? row.price.toFixed(5) : '--'}</td>
                            <td>${row.exit_price ? row.exit_price.toFixed(5) : '--'}</td>
                            <td><span class="result-badge ${row.result.toLowerCase()}">${row.result}</span></td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error("Dashboard fetch error:", e);
            }
        }

        async function fetchActiveSignals() {
            try {
                const res = await fetch('/api/active-signals');
                const actives = await res.json();
                const grid = document.getElementById('active-signals-grid');
                
                if (!actives || actives.length === 0) {
                    grid.innerHTML = '<div class="no-signal-card">Waiting for high-confluence signals...</div>';
                    return;
                }

                grid.innerHTML = actives.map(sig => `
                    <div class="signal-card ${sig.direction.toLowerCase()}">
                        <div class="card-header">
                            <span class="pair-name">${sig.pair}</span>
                            <span class="badge ${sig.direction.toLowerCase()}">${sig.direction}</span>
                        </div>
                        <div class="card-body">
                            <p>Score: <strong>${sig.score}/11</strong> (${sig.quality})</p>
                            <p>15M Bias: <strong>${sig.bias}</strong></p>
                            <p>Entry: <strong>${sig.price ? sig.price.toFixed(5) : '--'}</strong></p>
                            <p class="status-pending">Status: PENDING (1M Expiry)</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Active signals fetch error:", e);
            }
        }

        async function fetchPairs() {
            try {
                const res = await fetch('/api/pairs');
                const pairs = await res.json();
                const tbody = document.getElementById('pairs-table-body');
                
                // Handling pairs registry dictionary/list format
                const pairsArray = Array.isArray(pairs) ? pairs : Object.entries(pairs).map(([key, value]) => ({ symbol: key, display: value }));

                tbody.innerHTML = pairsArray.map(p => `
                    <tr>
                        <td><strong>${p.display || p.symbol}</strong></td>
                        <td>--</td>
                        <td><span class="status-dot online"></span> ACTIVE</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error("Pairs fetch error:", e);
            }
        }

        setInterval(fetchDashboardData, 5000);
        setInterval(fetchActiveSignals, 3000);
        setInterval(fetchPairs, 3000);

        fetchDashboardData();
        fetchActiveSignals();
        fetchPairs();
    </script>
