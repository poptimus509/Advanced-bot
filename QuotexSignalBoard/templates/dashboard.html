<div class="card bg-dark text-white p-4 mb-4 shadow">
    <h3 class="mb-3">📊 Live Market Evaluation & Scores</h3>
    <div class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>Pair</th>
                    <th>Direction</th>
                    <th>Score</th>
                    <th>Quality</th>
                    <th>5M Trend</th>
                    <th>Reason / Status</th>
                </tr>
            </thead>
            <tbody id="evaluation-table-body">
                <tr>
                    <td colspan="6" class="text-center text-muted">Loading live evaluations...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function fetchEvaluations() {
    try {
        const response = await fetch('/api/evaluations');
        const data = await response.json();
        const tbody = document.getElementById('evaluation-table-body');
        tbody.innerHTML = '';

        if (Object.keys(data).length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-warning">Waiting for next scan cycle...</td></tr>`;
            return;
        }

        for (const [pairName, evalData] of Object.entries(data)) {
            let badgeColor = 'secondary';
            if (evalData.direction === 'CALL') badgeColor = 'success';
            else if (evalData.direction === 'PUT') badgeColor = 'danger';

            let row = `
                <tr>
                    <td><strong>${pairName}</strong></td>
                    <td><span class="badge bg-${badgeColor}">${evalData.direction}</span></td>
                    <td><span class="badge bg-info text-dark">${evalData.score || 0} / 8</span></td>
                    <td>${evalData.quality || 'WAIT'}</td>
                    <td>${evalData.trend_5m || 'N/A'}</td>
                    <td><small class="text-muted">${evalData.score_reason || 'N/A'}</small></td>
                </tr>
            `;
            tbody.innerHTML += row;
        }
    } catch (error) {
        console.error('Error fetching evaluations:', error);
    }
}

// Fetch evaluations every 3 seconds
setInterval(fetchEvaluations, 3000);
fetchEvaluations();
</script>
